catalog:
  id: infra_docker
  platform: linux
  version: "1.0.0"
  description: "Docker 容器安全基线（新增类别，基于 CIS Docker Benchmark）"
  items:
    - id: DOCKER-SOCK-001
      category: 容器安全
      subsystem: Docker
      name: 限制 Docker 守护进程 socket 访问
      severity: high
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          ls -l /var/run/docker.sock 2>/dev/null | awk '{print $1, $3, $4}' || echo "none"
      judge:
        type: regex_absent
        value: "srw-rw-rw-"
        treat_empty_as: fail
      remediation: "将 /var/run/docker.sock 权限收紧为 root:docker 660，或仅通过 TLS 远程 socket 访问。"
      reference: "CIS Docker Benchmark 1.2"
      timeout: 10

    - id: DOCKER-DAEMON-002
      category: 容器安全
      subsystem: Docker
      name: 守护进程仅监听安全 socket
      severity: high
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          ps -ef 2>/dev/null | grep -i "[d]ockerd" | grep -oE "\-H\s+tcp://[^ ]+" | head -1 || echo "none"
      judge:
        type: regex_absent
        value: "tcp://"
        treat_empty_as: pass
      remediation: "不要将 dockerd 暴露为 -H tcp://0.0.0.0:2375，必须使用 TLS 认证 socket。"
      reference: "CIS Docker Benchmark 2.1"
      timeout: 10

    - id: DOCKER-USERNS-003
      category: 容器安全
      subsystem: Docker
      name: 启用用户命名空间重映射(userns-remap)
      severity: medium
      check_type: auto
      method:
        type: config_file
        path_catalog: docker_daemon_conf
        format: json
        section: ""
        key: userns-remap
      judge:
        type: regex_present
        value: "default|[^\\s]"
        treat_empty_as: fail
      remediation: "在 /etc/docker/daemon.json 设置 \"userns-remap\": \"default\" 并重启 dockerd。"
      reference: "CIS Docker Benchmark 2.8"
      timeout: 10

    - id: DOCKER-NEWP-004
      category: 容器安全
      subsystem: Docker
      name: 默认禁止容器获取新特权(no-new-privileges)
      severity: high
      check_type: auto
      method:
        type: config_file
        path_catalog: docker_daemon_conf
        format: json
        section: ""
        key: "no-new-privileges"
      judge:
        type: equals
        value: "true"
        treat_empty_as: fail
      remediation: "在 /etc/docker/daemon.json 设置 \"no-new-privileges\": true。"
      reference: "CIS Docker Benchmark 2.10"
      timeout: 10

    - id: DOCKER-LOG-005
      category: 容器安全
      subsystem: Docker
      name: 配置日志驱动与轮转
      severity: medium
      check_type: auto
      method:
        type: config_file
        path_catalog: docker_daemon_conf
        format: json
        section: ""
        key: log-driver
      judge:
        type: not_equals
        value: "none"
        treat_empty_as: fail
      remediation: "在 daemon.json 设置 log-driver(如 json-file) 并配置 log-opts max-size/max-file 轮转。"
      reference: "CIS Docker Benchmark 2.12"
      timeout: 10

    - id: DOCKER-AUTH-006
      category: 容器安全
      subsystem: Docker
      name: 启用镜像内容信任(DCT)
      severity: medium
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          echo "${DOCKER_CONTENT_TRUST:-0}"
      judge:
        type: equals
        value: "1"
        treat_empty_as: fail
      remediation: "导出 DOCKER_CONTENT_TRUST=1，启用镜像签名校验。"
      reference: "CIS Docker Benchmark 2.15"
      timeout: 10

    - id: DOCKER-ROOT-007
      category: 容器安全
      subsystem: Docker
      name: 容器不以 --privileged 运行
      severity: high
      check_type: manual
      method:
        type: manual
        description: "docker ps --format '{{.Names}}' 后逐个 docker inspect 检查 HostConfig.Privileged 应为 false，且未挂载敏感宿主路径。"
      remediation: "停止并重建以 --privileged 启动的容器；改用最小必要 cap-add。"
      reference: "CIS Docker Benchmark 5.4"
      timeout: 10

    - id: DOCKER-IMG-008
      category: 容器安全
      subsystem: Docker
      name: 使用可信基础镜像并定期扫描
      severity: medium
      check_type: manual
      method:
        type: manual
        description: "镜像应来自可信仓库并经漏洞扫描(CVE)；禁止 latest 标签用于生产。需人工核查 CI 流水线。"
      remediation: "接入镜像扫描(Trivy/Clair)，固定镜像摘要，阻断高危漏洞镜像。"
      reference: "CIS Docker Benchmark 4.x"
      timeout: 10

    - id: DOCKER-RESOURCE-009
      category: 容器安全
      subsystem: Docker
      name: 限制容器资源(CPU/内存)
      severity: low
      check_type: manual
      method:
        type: manual
        description: "生产容器应设 --memory/--cpus 上限，防止资源耗尽 DoS。需人工核查运行参数。"
      remediation: "为容器设置 --memory 与 --cpus 限制。"
      reference: "CIS Docker Benchmark 5.10/5.11"
      timeout: 10

    - id: DOCKER-HEALTH-010
      category: 容器安全
      subsystem: Docker
      name: 配置容器健康检查
      severity: low
      check_type: manual
      method:
        type: manual
        description: "关键容器镜像应定义 HEALTHCHECK，便于编排层剔除异常实例。需人工核查 Dockerfile。"
      remediation: "在 Dockerfile 增加 HEALTHCHECK 指令。"
      reference: "CIS Docker Benchmark 4.6"
      timeout: 10

    - id: DOCKER-FILE-011
      category: 容器安全
      subsystem: Docker
      name: 守护进程与证书文件权限
      severity: medium
      check_type: manual
      method:
        type: manual
        description: "/etc/docker、daemon.json 及 TLS 证书文件权限应仅限 root 可读写。需人工核查 chmod 600/644。"
      remediation: "chmod 644 /etc/docker/daemon.json; chmod 600 /etc/docker/ca.pem /etc/docker/cert.pem /etc/docker/key.pem"
      reference: "CIS Docker Benchmark 2.x"
      timeout: 10

    - id: DOCKER-SECCOMP-012
      category: 容器安全
      subsystem: Docker
      name: 启用默认 seccomp 配置
      severity: medium
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          docker info 2>/dev/null | grep -i "Security Options" | grep -i seccomp | head -1 || echo "none"
      judge:
        type: regex_present
        value: "seccomp"
        treat_empty_as: fail
      remediation: "确保 dockerd 未用 --seccomp-profile=unconfined；保持默认 seccomp。"
      reference: "CIS Docker Benchmark 5.5"
      timeout: 10

    - id: DOCKER-APPARMOR-013
      category: 容器安全
      subsystem: Docker
      name: 启用 AppArmor/SELinux 限制
      severity: medium
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          docker info 2>/dev/null | grep -i "Security Options" | grep -iE "apparmor|selinux" | head -1 || echo "none"
      judge:
        type: regex_present
        value: "apparmor|selinux"
        treat_empty_as: fail
      remediation: "在支持 AppArmor/SELinux 的宿主启用对应 profile，未用 --security-opt apparmor=unconfined。"
      reference: "CIS Docker Benchmark 5.1"
      timeout: 10

    - id: DOCKER-UPD-014
      category: 容器安全
      subsystem: Docker
      name: 及时升级 Docker 到安全版本
      severity: medium
      check_type: auto
      method:
        type: shell
        actual_cmd: |-
          docker version --format '{{.Server.Version}}' 2>/dev/null || echo "unknown"
      judge:
        type: regex_present
        value: "[0-9]+\\.[0-9]+"
        treat_empty_as: fail
      remediation: "升级 Docker Engine 至已修复已知漏洞的版本。"
      reference: "CIS Docker Benchmark 1.1"
      timeout: 10
